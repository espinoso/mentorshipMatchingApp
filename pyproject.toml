[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Disable isort (I): import-ordering is a style rule whose first-party detection
# differs between the Linux CI runner and local macOS, so it flagged inconsistently.
# Correctness/quality rules stay on (strict for new files).
ignore = ["I"]

# Deferred legacy cleanup: the pre-revamp modules below carry stylistic or defensive
# findings (blind/bare excepts, implicit Optional, unused unpacked vars, etc.) that are
# not bugs. Remove entries as each module is rewritten. New files get no ignores.
[tool.ruff.lint.per-file-ignores]
"app.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
"info.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
"matching.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
"normalization_utils.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
"prompts.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
"ui.py" = ["BLE001", "RUF013", "RUF059", "SIM102", "E722", "SIM115", "TRY002", "S110", "TRY004", "PLR1704"]
